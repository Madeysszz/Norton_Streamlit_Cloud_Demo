name: Norton Cloud Demo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cloud-demo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        id: install
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Python syntax
        id: syntax
        run: python -m compileall -q app.py demo_data.py tests scripts

      - name: Run pytest and Streamlit AppTest
        id: tests
        run: python -m pytest tests -q --junitxml=test-results/pytest.xml

      - name: Smoke test synthetic demo
        id: smoke
        if: ${{ always() && steps.install.outcome == 'success' && steps.syntax.outcome == 'success' }}
        run: python scripts/smoke_test.py

      - name: Write CI summary
        if: ${{ always() }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          SYNTAX_RESULT: ${{ steps.syntax.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Norton Cloud Demo CI

          | Check | Result |
          | --- | --- |
          | Install dependencies | $INSTALL_RESULT |
          | Python syntax | $SYNTAX_RESULT |
          | pytest and Streamlit AppTest | $TEST_RESULT |
          | Synthetic demo HTTP smoke | $SMOKE_RESULT |

          Data and model scores are synthetic. This job does not deploy the app or train models.
          EOF

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cloud-demo-ci-reports
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
